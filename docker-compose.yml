services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: eldercare-rabbitmq
    ports:
      - "5672:5672"    # AMQP (publishers/consumers)
      - "15672:15672"  # Management UI (http://localhost:15672 -> eldercare/eldercare_dev)
    environment:
      RABBITMQ_DEFAULT_USER: eldercare
      RABBITMQ_DEFAULT_PASS: eldercare_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  rabbitmq_data:
